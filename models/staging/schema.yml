version: 2

models:
  - name: stg_customers
    description: "Cleaned customer data from the raw source."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - unique
          - not_null

      - name: email
        description: "Customer email, trimmed and converted to lowercase."
        data_tests:
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Completed', 'Pending', 'Cancelled']
